# =============================================================================
# VPN/Proxy Agent - Configuration File
# =============================================================================
# Version: 1.0.0
# Description: Central configuration for all scripts and installers
# =============================================================================

# -----------------------------------------------------------------------------
# Python Configuration
# -----------------------------------------------------------------------------
DEFAULT_PYTHON_VERSION="3.12.6"
SUPPORTED_PYTHON_VERSIONS=("3.11.9" "3.12.6" "3.13.0")
PYTHON_BUILD_JOBS=4
PYTHON_INSTALL_PREFIX="/opt/python"

# -----------------------------------------------------------------------------
# System Configuration
# -----------------------------------------------------------------------------
UBUNTU_VERSION="22.04"
SUPPORTED_UBUNTU_VERSIONS=("20.04" "22.04" "24.04")

# -----------------------------------------------------------------------------
# Network Configuration
# -----------------------------------------------------------------------------
VPN_DEFAULT_PORT="51820"
SSH_DEFAULT_PORT="22"
SSH_ALTERNATE_PORT="53"
SOCKS5_DEFAULT_PORT="1080"

# Wireguard Configuration
WG_INTERFACE="wg0"
WG_SUBNET="10.0.0.0/24"
WG_SERVER_IP="10.0.0.1"
WG_MTU="1420"

# -----------------------------------------------------------------------------
# Docker Configuration
# -----------------------------------------------------------------------------
DOCKER_COMPOSE_VERSION="v2.24.0"
DOCKER_NETWORK_NAME="app_network"
POSTGRES_DEFAULT_PORT="5432"
REDIS_DEFAULT_PORT="6379"
MARIADB_DEFAULT_PORT="3306"

# -----------------------------------------------------------------------------
# Paths Configuration
# -----------------------------------------------------------------------------
PROJECT_ROOT="/home/ubuntu/projects"
SCRIPTS_DIR="/home/ubuntu/scripts"
LOGS_DIR="/home/ubuntu/logs"
BACKUPS_DIR="/home/ubuntu/backups"
DATA_DIR="/srv/data"

# -----------------------------------------------------------------------------
# Security Configuration
# -----------------------------------------------------------------------------
SSH_MAX_AUTH_TRIES="3"
SSH_LOGIN_GRACE_TIME="30"
FAIL2BAN_BANTIME="3600"
FAIL2BAN_MAXRETRY="5"

# -----------------------------------------------------------------------------
# Monitoring Configuration
# -----------------------------------------------------------------------------
MONITOR_INTERVAL="300"  # 5 minutes
HEALTH_CHECK_INTERVAL="600"  # 10 minutes
BACKUP_RETENTION_DAYS="7"
LOG_RETENTION_DAYS="30"

# -----------------------------------------------------------------------------
# API Endpoints (for testing)
# -----------------------------------------------------------------------------
API_ENDPOINTS=(
    "https://api.anthropic.com"
    "https://api.openai.com"
    "https://copilot-proxy.githubusercontent.com"
)

# -----------------------------------------------------------------------------
# Download URLs
# -----------------------------------------------------------------------------
PYTHON_DOWNLOAD_BASE="https://www.python.org/ftp/python"
DOCKER_INSTALL_URL="https://get.docker.com"
NETDATA_INSTALL_URL="https://my-netdata.io/kickstart.sh"

# -----------------------------------------------------------------------------
# Feature Flags
# -----------------------------------------------------------------------------
ENABLE_WIREGUARD="false"
ENABLE_DOCKER="true"
ENABLE_MONITORING="true"
ENABLE_AUTO_UPDATES="false"
ENABLE_BACKUPS="true"

# -----------------------------------------------------------------------------
# Vagrant Configuration
# -----------------------------------------------------------------------------
VAGRANT_BOX="ubuntu/focal64"
VAGRANT_MEMORY="2048"
VAGRANT_CPUS="2"
VAGRANT_PRIVATE_IP="192.168.56.10"

# -----------------------------------------------------------------------------
# Colors and Formatting (for terminal output)
# -----------------------------------------------------------------------------
# Note: These should be sourced by logging.sh
COLOR_RESET="\033[0m"
COLOR_RED="\033[0;31m"
COLOR_GREEN="\033[0;32m"
COLOR_YELLOW="\033[0;33m"
COLOR_BLUE="\033[0;34m"
COLOR_BOLD="\033[1m"
